name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ env.BUILD_PATH }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site and process Google Drive images
        # Astro hooks download/compress Drive images and validate exports before upload.
        env:
          GOOGLE_DRIVE_M45_PLEIADES_RGB_FILE_ID: ${{ secrets.GOOGLE_DRIVE_M45_PLEIADES_RGB_FILE_ID }}
          GOOGLE_DRIVE_CYGNUS_9PANEL_HA_OIII_RED_FILE_ID: ${{ secrets.GOOGLE_DRIVE_CYGNUS_9PANEL_HA_OIII_RED_FILE_ID }}
          GOOGLE_DRIVE_CYGNUS_9PANEL_HA_OIII_YELLOW_BLUE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_CYGNUS_9PANEL_HA_OIII_YELLOW_BLUE_FILE_ID }}
          GOOGLE_DRIVE_M31_RGB_HA_OIII_FILE_ID: ${{ secrets.GOOGLE_DRIVE_M31_RGB_HA_OIII_FILE_ID }}
          GOOGLE_DRIVE_NGC2174_MONKEYHEAD_NEBULA_HA_OIII_FILE_ID: ${{ secrets.GOOGLE_DRIVE_NGC2174_MONKEYHEAD_NEBULA_HA_OIII_FILE_ID }}
          GOOGLE_DRIVE_IC_1805_HEART_NEBULA_HA_OIII_FILE_ID: ${{ secrets.GOOGLE_DRIVE_IC_1805_HEART_NEBULA_HA_OIII_FILE_ID }}
          GOOGLE_DRIVE_NGC_1499_CALIFORNIA_NEBULA_HA_OIII_FILE_ID: ${{ secrets.GOOGLE_DRIVE_NGC_1499_CALIFORNIA_NEBULA_HA_OIII_FILE_ID }}
          GOOGLE_DRIVE_M31_RGB_FILE_ID: ${{ secrets.GOOGLE_DRIVE_M31_RGB_FILE_ID }}
          GOOGLE_DRIVE_NGC6888_CRESCENT_HA_OIII_NEBULA_FILE_ID: ${{ secrets.GOOGLE_DRIVE_NGC6888_CRESCENT_HA_OIII_NEBULA_FILE_ID }}
          GOOGLE_DRIVE_MOON_V2_FILE_ID: ${{ secrets.GOOGLE_DRIVE_MOON_V2_FILE_ID }}
          GOOGLE_DRIVE_SUN_V4_FILE_ID: ${{ secrets.GOOGLE_DRIVE_SUN_V4_FILE_ID }}
          GOOGLE_DRIVE_MOON_V1_FILE_ID: ${{ secrets.GOOGLE_DRIVE_MOON_V1_FILE_ID }}
          GOOGLE_DRIVE_SUN_V2_FILE_ID: ${{ secrets.GOOGLE_DRIVE_SUN_V2_FILE_ID }}
          GOOGLE_DRIVE_CYGNU_12PANEL_PARTIAL_HA_OIII_FILE_ID: ${{ secrets.GOOGLE_DRIVE_CYGNU_12PANEL_PARTIAL_HA_OIII_FILE_ID }}
          GOOGLE_DRIVE_IC_5070_PELICAN_NEBULA_HA_OIII_FILE_ID: ${{ secrets.GOOGLE_DRIVE_IC_5070_PELICAN_NEBULA_HA_OIII_FILE_ID }}
        run: |
          bun run build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
